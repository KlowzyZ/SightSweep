name: Feature request
description: Suggest a safe technician or network-discovery workflow.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: Explain the real workflow or pain point.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: dropdown
    id: category
    attributes:
      label: Category
      options:
        - Device discovery
        - Camera/NVR/DVR diagnostics
        - Projects and reports
        - User interface/accessibility
        - Localization
        - Privacy/security
        - Other
    validations:
      required: true
  - type: checkboxes
    id: boundary
    attributes:
      label: Safety boundary
      options:
        - label: This request does not require password guessing, exploitation, bypasses, or unauthorized scanning.
          required: true

